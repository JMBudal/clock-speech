<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clock Speech</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --wine: #741b3b;
    --wine-dark: #501027;
    --wine-soft: #f7edf1;
    --ink: #292329;
    --muted: #70666d;
    --line: #e7dfe3;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #ffffff;
    color: var(--ink);
    font-family: "Lato", Arial, Helvetica, sans-serif;
    font-size: 17px;
    line-height: 1.5;
}

.page {
    width: min(960px, calc(100% - 40px));
    margin: 0 auto;
    padding: 58px 0 40px;
}

/* CABEÇALHO */

header {
    text-align: center;
    margin-bottom: 42px;
}

.brand {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--wine);
    font-family: "Abril Fatface", Georgia, "Times New Roman", serif;
    font-size: clamp(2.6rem, 7vw, 4.4rem);
    line-height: 1.12;
    font-weight: 400;
}

/* RELÓGIO NA LETRA O */

.clock-o {
    width: .72em;
    height: .72em;
    display: inline-block;
    position: relative;
    flex: 0 0 .72em;
    border: .095em solid currentColor;
    border-radius: 50%;
    margin: 0 .015em .015em;

    background:
        radial-gradient(circle, currentColor 0 .035em, transparent .04em),
        radial-gradient(circle, #fff 0 63%, transparent 65%);

    box-shadow:
        inset 0 0 0 .025em rgba(116, 27, 59, .16),
        0 0 0 .012em rgba(116, 27, 59, .12);
}

/* MARCAÇÕES DAS HORAS */

.clock-o::before {
    content: "";
    position: absolute;
    inset: .035em;
    border-radius: 50%;

    background: repeating-conic-gradient(
        from 0deg,
        currentColor 0deg 2deg,
        transparent 2deg 30deg
    );

    -webkit-mask: radial-gradient(
        circle,
        transparent 0 69%,
        #000 72% 80%,
        transparent 83%
    );

    mask: radial-gradient(
        circle,
        transparent 0 69%,
        #000 72% 80%,
        transparent 83%
    );

    opacity: .8;
}

/* PONTEIROS */

.clock-hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    display: block;
    border-radius: 99px;
    transform-origin: 50% 100%;
    z-index: 2;
}

.clock-hand.hour {
    width: .055em;
    height: .19em;
    background: var(--wine-dark);
    transform: translateX(-50%) rotate(45deg);
}

.clock-hand.minute {
    width: .035em;
    height: .27em;
    background: var(--wine);
    transform: translateX(-50%);
    animation: minute-hand 8s linear infinite;
}

/* CENTRO DO RELÓGIO */

.clock-pin {
    position: absolute;
    z-index: 3;
    width: .075em;
    height: .075em;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    background: var(--wine-dark);
    border: .012em solid #fff;
    transform: translate(-50%, -50%);
}

/* ANIMAÇÃO */

@keyframes minute-hand {
    from {
        transform: translateX(-50%) rotate(0deg);
    }

    to {
        transform: translateX(-50%) rotate(360deg);
    }
}

.tagline {
    margin: 12px auto 0;
    max-width: 620px;
    color: var(--muted);
    font-size: 1.05rem;
}

/* ÁREA PRINCIPAL */

main {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: clamp(22px, 4vw, 38px);
    box-shadow: 0 12px 36px rgba(64, 25, 42, .06);
}

.section-title {
    margin: 0 0 8px;
    font-size: 1.35rem;
    color: var(--wine-dark);
}

.help {
    margin: 0 0 20px;
    color: var(--muted);
}

/* CAIXA DE TEXTO */

textarea {
    display: block;
    width: 100%;
    min-height: 250px;
    resize: vertical;
    padding: 18px;

    border: 1.5px solid #d9cbd1;
    border-radius: 12px;

    outline: none;
    color: var(--ink);
    background: #fff;

    font: inherit;
    line-height: 1.65;

    transition: border-color .2s, box-shadow .2s;
}

textarea:focus {
    border-color: var(--wine);
    box-shadow: 0 0 0 3px rgba(116, 27, 59, .10);
}

textarea::placeholder {
    color: #9a9096;
}

/* CONTADOR DE PALAVRAS */

.under-input {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 9px;
    color: var(--muted);
    font-size: .9rem;
}

/* CONTROLES */

.controls {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 20px;
    margin-top: 26px;
}

fieldset {
    border: 0;
    padding: 0;
    margin: 0;
    min-width: 0;
}

legend {
    padding: 0;
    margin-bottom: 10px;
    color: var(--wine-dark);
    font-weight: 700;
}

/* OPÇÕES DE VELOCIDADE */

.speeds {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.speed-option {
    position: relative;
}

.speed-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.speed-option label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 9px 16px;

    border: 1px solid #d9cbd1;
    border-radius: 9px;

    color: #554850;
    cursor: pointer;
    transition: .2s;
}

.speed-option input:checked + label {
    background: var(--wine-soft);
    border-color: var(--wine);
    color: var(--wine-dark);
    font-weight: 700;
}

.speed-option input:focus-visible + label {
    outline: 3px solid rgba(116, 27, 59, .25);
    outline-offset: 2px;
}

/* BOTÃO */

button {
    min-height: 50px;
    padding: 12px 22px;

    border: 0;
    border-radius: 10px;

    background: var(--wine);
    color: white;

    font: inherit;
    font-weight: 700;

    cursor: pointer;
    transition: background .2s, transform .2s;
}

button:hover {
    background: var(--wine-dark);
}

button:active {
    transform: translateY(1px);
}

button:focus-visible {
    outline: 3px solid rgba(116, 27, 59, .28);
    outline-offset: 3px;
}

/* RESULTADO */

.result {
    display: none;
    margin-top: 30px;
    padding: 24px;

    border-radius: 14px;
    background: var(--wine-soft);
    border: 1px solid #ead6df;
}

.result.visible {
    display: block;
}

.result-label {
    margin: 0;
    color: var(--wine-dark);
    font-weight: 700;
}

.time {
    margin: 4px 0 2px;
    color: var(--wine);

    font-size: clamp(2.6rem, 8vw, 4rem);
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
}

.details {
    margin: 8px 0 0;
    color: #65545d;
}

/* MENSAGENS */

.error {
    min-height: 1.4em;
    margin: 12px 0 0;
    color: #a3233e;
    font-size: .95rem;
}

/* RODAPÉ */

footer {
    margin-top: 22px;
    text-align: center;
    color: #877c82;
    font-size: .88rem;
}

/* RESPONSIVIDADE */

@media (max-width: 680px) {

    .page {
        width: min(100% - 28px, 560px);
        padding-top: 38px;
    }

    header {
        margin-bottom: 28px;
    }

    .controls {
        align-items: stretch;
        flex-direction: column;
    }

    .controls button {
        width: 100%;
    }

    textarea {
        min-height: 220px;
    }

    .under-input {
        flex-direction: column;
        gap: 2px;
    }

    main {
        border-radius: 16px;
    }
}

/* ACESSIBILIDADE */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}

</style>
</head>

<body>

<div class="page">

    <!-- CABEÇALHO -->

    <header>

        <div class="brand" aria-label="Clock Speech">

            Cl<span class="clock-o" aria-hidden="true">
                <span class="clock-hand hour"></span>
                <span class="clock-hand minute"></span>
                <span class="clock-pin"></span>
            </span>ck Speech

        </div>

        <p class="tagline">
            Calcule o tempo de leitura de qualquer texto
        </p>

    </header>

    <!-- CALCULADORA -->

    <main>

        <h1 class="section-title">
            Calculadora de tempo de leitura
        </h1>

        <p class="help">
            Cole ou digite o texto que será lido.
            Depois, escolha o ritmo de leitura.
        </p>

        <label
            for="textInput"
            class="section-title"
            style="font-size:1rem; display:block; margin-bottom:10px;"
        >
            Seu texto
        </label>

        <textarea
            id="textInput"
            placeholder="Cole seu texto aqui..."
            spellcheck="true"
        ></textarea>

        <div class="under-input">

            <span id="wordCount">0 palavras</span>

            <span>
                O cálculo considera apenas o texto digitado nesta caixa.
            </span>

        </div>

        <!-- VELOCIDADE DE LEITURA -->

        <div class="controls">

            <fieldset>

                <legend>Velocidade de leitura</legend>

                <div class="speeds">

                    <div class="speed-option">

                        <input
                            type="radio"
                            id="fast"
                            name="speed"
                            value="165"
                        >

                        <label for="fast">
                            Rápida
                        </label>

                    </div>

                    <div class="speed-option">

                        <input
                            type="radio"
                            id="regular"
                            name="speed"
                            value="140"
                            checked
                        >

                        <label for="regular">
                            Regular
                        </label>

                    </div>

                    <div class="speed-option">

                        <input
                            type="radio"
                            id="slow"
                            name="speed"
                            value="102"
                        >

                        <label for="slow">
                            Pausada
                        </label>

                    </div>

                </div>

            </fieldset>

            <button id="calculateButton" type="button">
                Calcular tempo de leitura
            </button>

        </div>

        <p
            class="error"
            id="errorMessage"
            role="alert"
            aria-live="polite"
        ></p>

        <!-- RESULTADO -->

        <section
            class="result"
            id="result"
            aria-live="polite"
            aria-atomic="true"
        >

            <p class="result-label">
                Tempo estimado de leitura
            </p>

            <p class="time" id="timeOutput">
                00:00
            </p>

            <p class="details" id="detailOutput"></p>

        </section>

    </main>


</div>

<!-- JAVASCRIPT: MOTOR DA CALCULADORA -->

<script>

const textInput = document.getElementById('textInput');

const wordCount = document.getElementById('wordCount');

const calculateButton = document.getElementById('calculateButton');

const result = document.getElementById('result');

const timeOutput = document.getElementById('timeOutput');

const detailOutput = document.getElementById('detailOutput');

const errorMessage = document.getElementById('errorMessage');


/* CONTAGEM DE PALAVRAS */

function countWords(text) {

    const trimmed = text.trim();

    if (!trimmed) return 0;

    return trimmed.split(/\s+/u).filter(Boolean).length;

}


/* ATUALIZAÇÃO AUTOMÁTICA DO CONTADOR */

function updateWordCount() {

    const total = countWords(textInput.value);

    wordCount.textContent =
        `${total} ${total === 1 ? 'palavra' : 'palavras'}`;

    errorMessage.textContent = '';

}


/* FORMATAÇÃO DO TEMPO */

function formatTime(totalSeconds) {

    const minutes = Math.floor(totalSeconds / 60);

    const seconds = totalSeconds % 60;

    if (minutes === 0) {

        return `${seconds} ${seconds === 1 ? 'segundo' : 'segundos'}`;

    }

    if (seconds === 0) {

        return `${minutes} min`;

    }

    return `${minutes} min ${seconds} s`;

}


/* ANIMAÇÃO DO CRONÔMETRO (0 até o tempo estimado, ~0,35 s) */

let timerAnimation = null;

function formatClock(totalSeconds) {

    const m = Math.floor(totalSeconds / 60);

    const s = totalSeconds % 60;

    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

}

function animateTime(totalSeconds) {

    if (timerAnimation) cancelAnimationFrame(timerAnimation);

    const finalText = formatClock(totalSeconds);

    const reduceMotion =
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion) {

        timeOutput.textContent = finalText;

        return;

    }

    const duration = 350;

    const startTime = performance.now();

    timeOutput.setAttribute('aria-hidden', 'true');

    function step(now) {

        const progress = Math.min((now - startTime) / duration, 1);

        const eased = 1 - Math.pow(1 - progress, 3);

        timeOutput.textContent =
            formatClock(Math.round(totalSeconds * eased));

        if (progress < 1) {

            timerAnimation = requestAnimationFrame(step);

        } else {

            timeOutput.textContent = finalText;

            timeOutput.removeAttribute('aria-hidden');

            timerAnimation = null;

        }

    }

    timeOutput.textContent = '00:00';

    timerAnimation = requestAnimationFrame(step);

}


/* CÁLCULO DO TEMPO DE LEITURA */

function calculateReadingTime() {

    const words = countWords(textInput.value);

    // Verifica se existe texto

    if (words === 0) {

        result.classList.remove('visible');

        errorMessage.textContent =
            'Digite ou cole um texto antes de calcular.';

        textInput.focus();

        return;

    }

    // Identifica a velocidade selecionada

    const selectedSpeed =
        document.querySelector('input[name="speed"]:checked');

    const wordsPerMinute = Number(selectedSpeed.value);

    // Calcula o tempo em segundos

    const seconds = Math.max(
        1,
        Math.ceil((words / wordsPerMinute) * 60)
    );

    // Converte para minutos e segundos

    const minutesPart = Math.floor(seconds / 60);

    const secondsPart = seconds % 60;

    const clock =
        `${String(minutesPart).padStart(2, '0')}:${String(secondsPart).padStart(2, '0')}`;

    // Apresenta o resultado

    animateTime(seconds);

    detailOutput.textContent =
        `${words} ${words === 1 ? 'palavra' : 'palavras'} · ritmo ${selectedSpeed.nextElementSibling.textContent.toLowerCase()} · aproximadamente ${formatTime(seconds)}.`;

    result.classList.add('visible');

    errorMessage.textContent = '';

}


/* EVENTOS */

textInput.addEventListener('input', updateWordCount);

calculateButton.addEventListener('click', calculateReadingTime);


/* ATALHO: CTRL + ENTER */

textInput.addEventListener('keydown', (event) => {

    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {

        calculateReadingTime();

    }

});


/* INICIALIZAÇÃO */

updateWordCount();

</script>

</body>
</html>
